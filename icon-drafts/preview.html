<!doctype html>
<html><head><meta charset="utf-8"><title>Icon drafts</title>
<style>
body{margin:0;padding:28px;font:15px "Segoe UI Variable Text","Segoe UI",sans-serif;background:#f3f3f3;color:#1b1b1b}
h1{font-size:22px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fbfbfb;border:1px solid #e5e5e5;border-radius:10px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px}
.big{display:block;width:128px;height:128px;margin:0 auto 14px}
.strip{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:8px;margin-top:6px}
.light{background:#eeeeee}.dark{background:#1f1f1f;color:#ddd}
.strip small{margin-left:auto;font-size:12px;opacity:.7}
</style></head><body>
<h1>Audio Split: icon drafts</h1>
<div class="grid" id="g"></div>
<script>
const icons=[["1-bars.svg","1 · Sound bars"],["2-split.svg","2 · Split line"],["3-two-dots.svg","3 · Two speakers"],["4-speaker-fork.svg","4 · Speaker fork"],["5-left-right.svg","5 · Left / right bars"],["6-broadcast.svg","6 · Both ways"]];
document.getElementById("g").innerHTML=icons.map(([f,n])=>`<div class="card"><h2>${n}</h2><img class="big" src="${f}">
${["light","dark"].map(t=>`<div class="strip ${t}"><img src="${f}" width="48"><img src="${f}" width="32"><img src="${f}" width="24"><img src="${f}" width="16"><small>${t==="light"?"light taskbar":"dark taskbar"}</small></div>`).join("")}</div>`).join("");
</script></body></html>
